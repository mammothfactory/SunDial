[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sundial"
version = "0.1.0"
description = "Meet SunDial. A familiar touch. In every room."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sundial-hub = "hub.app.main:run"
sundial-provision = "scripts.provision:main"
sundial-sim = "simulator.dial_sim:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
