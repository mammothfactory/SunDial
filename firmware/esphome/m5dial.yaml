# SunDial — ESPHome fallback for the M5Stack Dial v1.1.
# Proven ESPHome path (community configs exist for this board); the
# MicroPython firmware in ../micropython is the Python-on-device path and
# is untested on hardware. Generate a per-room copy with:
#   python scripts/provision.py --room living
# Pins below are the verified Dial v1.1 pins (see docs/HARDWARE.md).
# NOT compiled here — compile with `esphome compile` on a machine with ESPHome.
substitutions:
  room_id: living
  room_name: Living
  device_name: sundial-living-01

esphome:
  name: ${device_name}
  friendly_name: "SunDial ${room_name}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SunDial-${room_id}-Fallback"

api:
ota:
  - platform: esphome
logger:

i2c:
  sda: GPIO13
  scl: GPIO15

spi:
  clk_pin: GPIO36
  mosi_pin: GPIO35

display:
  - platform: gc9a01
    model: M5STACK_DIAL
    reset_pin: GPIO8
    cs_pin: GPIO9
    dc_pin: GPIO39
    id: dial_display
    lambda: |-
      it.fill(0x0B2E2B);
      it.printf(120, 100, id(font_large), 0xF5EFE6, TextAlign::CENTER, "%d%%", (int)id(centre_pct).state);
      it.print(120, 130, id(font_small), 0xD9A441, TextAlign::CENTER, "SUNDIAL");
      it.print(120, 30, id(font_small), 0xD9A441, TextAlign::CENTER, "${room_name}");

touchscreen:
  - platform: ft5x06
    address: 0x38
    id: dial_touch
    on_touch:
      - lambda: |-
          id(mode_select).select_next();

sensor:
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      - lambda: |-
          id(dial_event).publish("rotate:+1");
    on_anticlockwise:
      - lambda: |-
          id(dial_event).publish("rotate:-1");
  - platform: pcf8563
    address: 0x51
    id: rtc
  - platform: template
    id: centre_pct
    name: "${room_name} Dial Centre %"
    lambda: |-
      return 65;

binary_sensor:
  - platform: gpio
    pin: GPIO42
    name: "${room_name} Dial Button"
    on_click:
      min_length: 50ms
      max_length: 1000ms
      then:
        - lambda: |-
            id(mode_select).select_next();
    on_click:
      min_length: 1500ms
      max_length: 5000ms
      then:
        - lambda: |-
            id(dial_event).publish("long_press");

select:
  - platform: template
    id: mode_select
    name: "${room_name} Dial Mode"
    options:
      - Lights
      - Fan
      - HVAC
    initial_option: Lights

text_sensor:
  - platform: template
    id: dial_event
    name: "${room_name} Dial Event"

output:
  - platform: ledc
    pin: GPIO3
    id: buzzer_out

rtttl:
  output: buzzer_out
  id: buzzer

rc522_i2c:
  address: 0x28
  id: rfid_reader
  on_tag:
    then:
      - lambda: |-
          ESP_LOGI("rfid", "tag: %s", x.c_str());

font:
  - file: "gfonts://Roboto@400"
    id: font_small
    size: 20
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 48
